apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-hello
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: go-hello

  template:
    metadata:
      labels:
        app: go-hello

    spec:
      containers:
        - name: go-hello
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
