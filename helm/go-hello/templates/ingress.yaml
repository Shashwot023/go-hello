apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-hello
spec:
  ingressClassName: nginx

  rules:
    - host: go.shash.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-hello
                port:
                  number: 80
